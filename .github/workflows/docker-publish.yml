name: Build and Publish Docker Image

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/atlantis
  PRISMA_PROVIDER: sqlite
  DATABASE_URL: file:./data/atlantis.db

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      sha_tag: ${{ steps.meta_sha.outputs.tags }}
    steps:
      - name: Docker meta (canonical tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long
      - name: Docker meta (sha only, reused for manifest sources)
        id: meta_sha
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runs-on: ubuntu-24.04
            platform: linux/arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta (arch-suffixed)
        id: meta_arch
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-${{ matrix.arch }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long

      - name: Build and push ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta_arch.outputs.tags }}
          labels: ${{ steps.meta_arch.outputs.labels }}
          cache-from: type=gha,scope=atlantis-${{ matrix.arch }}
          cache-to: type=gha,scope=atlantis-${{ matrix.arch }},mode=min,compression=zstd,compression-level=3
          build-args: |
            PRISMA_PROVIDER=${{ env.PRISMA_PROVIDER }}
            DATABASE_URL=${{ env.DATABASE_URL }}

  manifest:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifest
        env:
          TAGS: ${{ needs.metadata.outputs.tags }}
          IMAGE: ${{ env.IMAGE_NAME }}
          SHA_TAG: ${{ needs.metadata.outputs.sha_tag }}
        run: |
          # TAGS is newline-separated; convert to -t arguments
          tag_args=""
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            tag_args="$tag_args -t $t"
          done <<< "$TAGS"

          # Use the per-arch SHA tags as sources for the manifest
          docker buildx imagetools create \
            $tag_args \
            "$IMAGE:${SHA_TAG}-amd64" \
            "$IMAGE:${SHA_TAG}-arm64"

      - name: Inspect manifest
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          SHA_TAG: ${{ needs.metadata.outputs.sha_tag }}
        run: |
          ref=$(echo "$SHA_TAG" | head -n1)
          docker buildx imagetools inspect "$IMAGE:$ref"
