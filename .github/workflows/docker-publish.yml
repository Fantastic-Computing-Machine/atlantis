name: Build and Publish Docker Image

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - '**.md'
      - 'LICENSE'
      - '**.txt'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/atlantis
  PRISMA_PROVIDER: sqlite
  DATABASE_URL: file:./data/atlantis.db

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runs-on: ubuntu-24.04
            platform: linux/arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta (arch-suffixed)
        id: meta_arch
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            suffix=-${{ matrix.arch }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta_arch.outputs.tags }}
          labels: ${{ steps.meta_arch.outputs.labels }}
          cache-from: type=gha,scope=atlantis-${{ matrix.arch }}
          cache-to: type=gha,scope=atlantis-${{ matrix.arch }},mode=min,compression=zstd,compression-level=3
          build-args: |
            PRISMA_PROVIDER=${{ env.PRISMA_PROVIDER }}
            DATABASE_URL=${{ env.DATABASE_URL }}

  manifest:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta (canonical tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Create multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ${{ env.IMAGE_NAME }}
        run: |
          # For each canonical tag, create a manifest from the arch-suffixed images
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            # Extract just the tag portion (after the colon)
            tag_name="${tag##*:}"
            echo "Creating manifest for $tag from ${tag}-amd64 and ${tag}-arm64"
            docker buildx imagetools create \
              -t "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done <<< "$TAGS"

      - name: Inspect manifest
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
        run: |
          docker buildx imagetools inspect "$IMAGE:latest" || true
